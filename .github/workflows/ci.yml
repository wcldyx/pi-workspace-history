name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The oldest supported pi release and the locked development version.
        pi: ["0.84.4", "locked"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install Jujutsu
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: jj-cli@0.44.0
      - run: npm ci
      - name: Use pi ${{ matrix.pi }}
        if: matrix.pi != 'locked'
        run: npm install --no-save --no-audit --no-fund @earendil-works/pi-coding-agent@${{ matrix.pi }} @earendil-works/pi-ai@${{ matrix.pi }} @earendil-works/pi-tui@${{ matrix.pi }}
      - run: npm run typecheck
      - run: npm test
        env:
          PI_WORKSPACE_HISTORY_REQUIRE_JUJUTSU: ${{ runner.os == 'Linux' && '1' || '0' }}
      - run: git diff --check
